{{- /* chezmoi:modify-template */ -}}
{{- /*
    chezmoi modify_ for ~/.codex/config.toml

    只改寫 [tui] 區塊裡 $managed 列出的 key，其餘位元組原封不動 ——
    註解、key 順序、空行、其他 [table]、Codex 自己寫進來的東西全部保留。

    不用 `fromToml | setValueAtPath | toToml`：那會吃掉全部註解、把 key 重排成
    字典序、拆開 [a.b] 表頭，還會把不帶時區 offset 的 TOML date 依本機時區位移。
    詳見 docs/research/chezmoi-templates-partial-config.md §3.3。

    這裡是純模板（modify-template）而不是原本的 sh + awk 腳本，因為 chezmoi 在
    Windows 上會直接 exec modify_ 腳本而失敗（%1 is not a valid Win32
    application）。modify-template 由 chezmoi 自己算繪，三個平台共用同一份實作。
    演算法逐條對應原本的 awk 版，行為由 tests/cases/L6 的 golden 釘住 —— 那些
    golden 就是 awk 版跑出來的輸出。

    假設：受管的 key 各自寫在一行（key = value）。
*/ -}}

{{- $table := "tui" -}}
{{- $managed := list
      `status_line = ["model-with-reasoning", "current-dir", "project-name", "git-branch", "five-hour-limit", "weekly-limit", "context-window-size", "used-tokens"]`
      `status_line_use_colors = true` -}}

{{- /* key -> 受管的整行；補寫時要照 $order 的順序 */ -}}
{{- $want := dict -}}
{{- $order := list -}}
{{- range $m := $managed -}}
{{-   $k := trimAll " \t" (index (splitn "=" 2 $m) "_0") -}}
{{-   $_ := set $want $k $m -}}
{{-   $order = append $order $k -}}
{{- end -}}

{{- $content := "" -}}
{{- if hasKey .chezmoi "stdin" -}}{{- $content = .chezmoi.stdin -}}{{- end -}}
{{- /* awk 的 print 一律補換行，所以輸出永遠以換行結尾；輸入原本有沒有結尾換行
       不影響結果。這裡去掉它只是為了不要多切出一個空行。 */ -}}
{{- $body := trimSuffix "\n" $content -}}
{{- $lines := list -}}
{{- /* 條件看 $content 而不是 $body：只有一個換行的檔案（$body 變成空字串）
       在 awk 眼裡是「一行空行」（NR=1），不是空檔（NR=0），兩者的輸出不同。
       這個差別是 tools/gate-properties.py 的 P2 抓出來的。 */ -}}
{{- if ne $content "" -}}{{- $lines = splitList "\n" $body -}}{{- end -}}

{{- /* 走訪時在結尾追加一個哨兵，讓「離開 [tui] 區塊」的收尾邏輯只需要寫一次
       （awk 版在遇到表頭與 END 兩處各呼叫一次 flush()）。 */ -}}
{{- /* NUL 開頭：TOML 檔案裡不可能出現這一行，不會跟真實內容撞到。 */ -}}
{{- $SENTINEL := "\u0000chezmoi-eof" -}}
{{- $out := list -}}
{{- $buf := list -}}
{{- $done := dict -}}
{{- $inTable := false -}}
{{- $seen := false -}}

{{- range $line := (append $lines $SENTINEL) -}}
{{-   $atEof := eq $line $SENTINEL -}}
{{-   if or $atEof (regexMatch "^[ \t]*\\[" $line) -}}
{{-     if $inTable -}}
      {{- /* 收尾：把緩衝的區塊內容吐出去，沒出現過的受管 key 補在區塊尾端 ——
             但要補在結尾空行「之前」，否則會插到下一個 table 的前面去。 */ -}}
{{-       $last := -1 -}}
{{-       range $i, $b := $buf -}}
{{-         if not (regexMatch "^[ \t]*$" $b) -}}{{- $last = $i -}}{{- end -}}
{{-       end -}}
{{-       $head := slice $buf 0 (add $last 1) -}}
{{-       $trailingBlanks := slice $buf (add $last 1) -}}
{{-       $out = concat $out $head -}}
{{-       $appended := false -}}
{{-       range $k := $order -}}
{{-         if not (hasKey $done $k) -}}
{{-           $out = append $out (get $want $k) -}}
{{-           $_ := set $done $k true -}}
{{-           $appended = true -}}
{{-         end -}}
{{-       end -}}
{{-       $out = concat $out $trailingBlanks -}}
      {{- /* 有補寫、原本又沒有結尾空行時，補一個空行把 [tui] 跟下一個 table 隔開。
             檔尾不需要。 */ -}}
{{-       if and $appended (eq (len $trailingBlanks) 0) (not $atEof) -}}
{{-         $out = append $out "" -}}
{{-       end -}}
{{-       $buf = list -}}
{{-       $inTable = false -}}
{{-     end -}}
{{-     if not $atEof -}}
{{-       $hdr := regexReplaceAll "^[ \t]*\\[[ \t]*" $line "" -}}
{{-       $hdr = regexReplaceAll "[ \t]*\\].*$" $hdr "" -}}
{{-       if eq $hdr $table -}}{{- $inTable = true -}}{{- $seen = true -}}{{- end -}}
{{-       $out = append $out $line -}}
{{-     end -}}
{{-   else if $inTable -}}
{{-     $k := regexReplaceAll "[ \t]*=.*$" (regexReplaceAll "^[ \t]*" $line "") "" -}}
{{-     if hasKey $want $k -}}
      {{- /* 受管的 key：換成我們的版本；同一個 key 再出現就整行丟掉 */ -}}
{{-       if not (hasKey $done $k) -}}
{{-         $buf = append $buf (get $want $k) -}}
{{-         $_ := set $done $k true -}}
{{-       end -}}
{{-     else -}}
{{-       $buf = append $buf $line -}}
{{-     end -}}
{{-   else -}}
{{-     $out = append $out $line -}}
{{-   end -}}
{{- end -}}

{{- /* 整個檔案沒有 [tui]：補在最後 */ -}}
{{- if not $seen -}}
{{-   if gt (len $lines) 0 -}}{{- $out = append $out "" -}}{{- end -}}
{{-   $out = append $out (printf "[%s]" $table) -}}
{{-   range $k := $order -}}{{- $out = append $out (get $want $k) -}}{{- end -}}
{{- end -}}
{{ join "\n" $out }}
