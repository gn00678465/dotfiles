{{- /*
  平台判斷的唯一來源。呼叫端一律：

      {{- $p := includeTemplate "platform.toml" . | fromToml -}}

  然後讀 $p.os / $p.arch / $p.isWindows / $p.isPosix / $p.brewPrefix / $p.distro / $p.pkgManager。
  不要在別的地方寫 `eq .chezmoi.os "..."` 或自己拼 brew prefix —— 這個 repo 現在有
  三個目標平台，平台知識散開就會出現「某一支腳本忘了跟上」的那種錯。

  osOverride / archOverride 是刻意留的測試接縫，只有這個檔案認得它們。正式環境的
  chezmoi config 沒有這兩個 key，所以永遠退回 .chezmoi.os / .chezmoi.arch。
  存在的理由：這個 repo 沒有 macOS 實機，也不允許在 Windows 主機上真的 apply
  （SPEC Must NOT #1），三個平台的渲染證據只能在單一台機器上取得。
  接縫本身由 tests/cases/L1 與 L8 驗證：L1 證明沒有 override 時會退回真實值，
  L8 證明 osOverride=windows 的渲染結果與 Windows 主機上真跑一次逐字相同。
*/ -}}
{{- /* chezmoi 用 missingkey=error 算繪模板，缺 key 會直接報錯，
       所以這裡不能靠 `default` 兜，一定要先 hasKey。 */ -}}
{{- $os := .chezmoi.os -}}
{{- $arch := .chezmoi.arch -}}
{{- if hasKey . "osOverride" -}}{{- $os = .osOverride -}}{{- end -}}
{{- if hasKey . "archOverride" -}}{{- $arch = .archOverride -}}{{- end -}}
{{- /* 發行版：chezmoi 只在 Linux 讀 /etc/os-release；其他平台 .chezmoi.osRelease
       是空 map，所以兩層 hasKey 都要擋。distroOverride 是第三個測試接縫，性質同上：
       這個 repo 的渲染主機不是 Arch，Arch 的證據只能靠它取得。
       distroLike 是 ID_LIKE：正式安裝的 omarchy 把 /etc/os-release 換成 ID=omarchy、
       ID_LIKE=arch（實測 4.0.2），只看 ID 會把它當成 Debian。純 Arch 沒有 ID_LIKE 這一行，
       所以這個 key 也要 hasKey。distroLikeOverride 是第四個接縫，只給 os-omarchy fixture。 */ -}}
{{- $distro := "" -}}
{{- $distroLike := "" -}}
{{- if and (eq $os "linux") (hasKey .chezmoi "osRelease") -}}
{{-   if hasKey .chezmoi.osRelease "id" -}}{{- $distro = .chezmoi.osRelease.id -}}{{- end -}}
{{-   if hasKey .chezmoi.osRelease "idLike" -}}{{- $distroLike = .chezmoi.osRelease.idLike -}}{{- end -}}
{{- end -}}
{{- if hasKey . "distroOverride" -}}{{- $distro = .distroOverride -}}{{- end -}}
{{- if hasKey . "distroLikeOverride" -}}{{- $distroLike = .distroLikeOverride -}}{{- end -}}
{{- /* Linux 的系統套件管理員。Arch 家族 = ID 是 arch，或 ID_LIKE 以空白分割後含有 arch
       這個字（逐字比對，"archarch" 不算）。沒認出來的發行版退回 apt，與 Arch 支援之前的
       行為相同。distro 保留原值，呼叫端只看 pkgManager 與 brewPrefix。 */ -}}
{{- $archFamily := or (eq $distro "arch") (has "arch" (splitList " " $distroLike)) -}}
{{- $pkgManager := "" -}}
{{- if eq $os "linux" -}}
{{-   $pkgManager = $archFamily | ternary "pacman" "apt" -}}
{{- end -}}
{{- /* Windows 與 Arch 沒有 brew。這裡留空字串而不是任何路徑，好讓忘了守的呼叫端
       拼出明顯壞掉的字串，而不是一條看似合理、實際不存在的路徑。「brewPrefix 非空」
       就是「這個平台用 brew」的唯一訊號。 */ -}}
{{- $brewPrefix := "" -}}
{{- if eq $pkgManager "apt" -}}
{{-   $brewPrefix = "/home/linuxbrew/.linuxbrew" -}}
{{- else if eq $os "darwin" -}}
{{-   $brewPrefix = (eq $arch "arm64") | ternary "/opt/homebrew" "/usr/local" -}}
{{- end -}}
os = {{ $os | quote }}
arch = {{ $arch | quote }}
isWindows = {{ eq $os "windows" }}
isPosix = {{ ne $os "windows" }}
brewPrefix = {{ $brewPrefix | quote }}
distro = {{ $distro | quote }}
pkgManager = {{ $pkgManager | quote }}
